plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mtg.voucher'
    compileSdk 35

    defaultConfig {
        applicationId "com.mtg.voucher"
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "2.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}
