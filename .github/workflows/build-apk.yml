name: Build + Verify MTG Voucher APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK structure
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" | tee apk-contents.txt
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          echo "APK size:"
          ls -lh "$APK"

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$APK"

      - name: Verify APK badging
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | tee apk-badging.txt

      - name: Package final APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MTG-Voucher-v2.apk
          sha256sum MTG-Voucher-v2.apk > MTG-Voucher-v2.sha256.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MTG-Voucher-v2-VERIFIED
          path: |
            MTG-Voucher-v2.apk
            MTG-Voucher-v2.sha256.txt
            apk-contents.txt
            apk-badging.txt
          if-no-files-found: error
